<section id="send" class="panel send" aria-labelledby="send-h" tabindex="-1">
<h2 id="send-h">[[send.heading]]</h2>
<p>[[send.intro]]</p>
<p id="send-summary" aria-live="polite"></p>
<ul id="send-incomplete" class="incomplete" hidden></ul>
<div class="send-row">
<button type="button" id="send-share" class="btn primary">[[send.button]]</button>
<button type="button" id="send-save" class="btn">[[send.save]]</button>
</div>
<p id="send-status" class="msg" role="status"></p>
<p id="send-last" class="muted"></p>
</section>
