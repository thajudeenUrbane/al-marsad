<section id="reviewer" class="panel reviewer" aria-labelledby="reviewer-h" tabindex="-1">
<h2 id="reviewer-h">[[reviewer.heading]]</h2>
<p>[[reviewer.intro]]</p>
<div class="reviewer-row">
<label for="reviewer-id">[[reviewer.label]]</label>
<input type="text" id="reviewer-id" name="reviewer-id" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="80" aria-describedby="reviewer-msg">
<button type="button" id="reviewer-save" class="btn primary">[[reviewer.save]]</button>
</div>
<p id="reviewer-msg" class="msg" aria-live="polite"></p>
</section>
