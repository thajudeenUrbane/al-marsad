}
function renderPerson(p) {
  const f = document.createDocumentFragment();
  const { row, box } = headRow("Person", p.name);
  if (p.aka.length) box.appendChild(h("p", "meta", "Also known as " + p.aka.join(", ")));
  const nParts = new Set(p.stories.map(n => byN.get(n).part)).size;
  const meta = h("p", "meta"); meta.innerHTML = `Named in <b>${p.count}</b> of the 50 stories, across <b>${nParts}</b> of the 4 parts.`;
  box.appendChild(meta);
  f.appendChild(row);
  f.appendChild(strip(p));

  const sec = h("div"); sec.appendChild(h("h3", null, p.count === 1 ? "Their story" : "Their stories, in order"));

  });
  sec.appendChild(ol); f.appendChild(sec);

  const co = sharedWith(p);

    const wrap = h("div", "cochips");

        const b = h("button", "cochip"); b.type = "button";
        b.append(document.createTextNode(q.name), h("span", "c", c));

function renderStory(s) {

  pg.append(mk(prev ? "← " + prev.n + " " + prev.short : "", prev), mk(next ? next.n + " " + next.short + " →" : "", next));

function renderPanel() {
  panel.innerHTML = "";
  const pin = h("div", "pin");
  const sel = state.sel;
  pin.appendChild(!sel ? renderIntro() : sel.t === "p" ? renderPerson(byId.get(sel.id)) : renderStory(byN.get(sel.n)));

}

// ---------- tooltip ----------
function showTip(target, x, y) {
  if (!target) { tip.hidden = true; return; }
  if (target.t === "p") {
    const p = byId.get(target.id);
    tip.innerHTML = "";
    tip.append(h("b", null, p.name), document.createTextNode(`In ${p.count} ${p.count === 1 ? "story" : "stories"}` + (p.aka.length ? ` · also ${p.aka.join(", ")}` : "")));
  } else {
    const s = byN.get(target.n);
    tip.innerHTML = "";
    tip.append(h("b", null, storyLabel(s)), document.createTextNode(`Names ${s.people.length} ${s.people.length === 1 ? "person" : "people"}`));
  }
  tip.hidden = false;
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(W - tw / 2 - 6, Math.max(tw / 2 + 6, x)) + "px";
  tip.style.top = Math.max(tip.offsetHeight + 16, y) + "px";
}
function targetOf(e) {
  const n = e.target.closest && e.target.closest("[data-p],[data-s]");
  if (!n) return null;
  return n.dataset.p ? { t: "p", id: n.dataset.p } : { t: "s", n: +n.dataset.s };
}
const same = (a, b) => (!a && !b) || (a && b && a.t === b.t && a.id === b.id && a.n === b.n);

// ---------- pointer: hover, click, drag, pinch, wheel ----------
const ptrs = new Map();
let drag = null, pinch = null;
function local(e) { const r = svg.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function zoomAt(k, px, py) {
  k = Math.min(7, Math.max(1, k));
  const ux = (px - CX - view.x) / (R * view.k), uy = (py - CY - view.y) / (R * view.k);
  view.k = k;
  view.x = px - CX - ux * R * k; view.y = py - CY - uy * R * k;
  if (k === 1) { view.x = 0; view.y = 0; }
  clampView();
  svg.classList.toggle("zoomed", view.k > 1);
  schedule();
}
function clampView() { const lim = R * view.k; view.x = Math.max(-lim, Math.min(lim, view.x)); view.y = Math.max(-lim, Math.min(lim, view.y)); }
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; place(); }); }

svg.addEventListener("pointerdown", e => {
  const p = local(e);
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) drag = { x: p.x, y: p.y, vx: view.x, vy: view.y, moved: false, target: targetOf(e), pointerType: e.pointerType };
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
    if (drag) drag.moved = true;
  }
});
window.addEventListener("pointermove", e => {
  if (ptrs.has(e.pointerId)) {
    const p = local(e); ptrs.set(e.pointerId, p);
    if (pinch && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      zoomAt(pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
      return;
    }
    if (drag) {
      const dx = p.x - drag.x, dy = p.y - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 5) drag.moved = true;
      if (drag.moved && view.k > 1) { view.x = drag.vx + dx; view.y = drag.vy + dy; clampView(); svg.classList.add("dragging"); tip.hidden = true; schedule(); }
    }
    return;
  }

    if (!same(t, state.hover)) { state.hover = t; refresh(); }
    if (t) { const p = local(e); showTip(t, p.x, p.y); } else tip.hidden = true;
  }
});
function endPointer(e) {

      const t = d.target;
      if (!t) select(null);
      else if (same(t, state.sel)) select(null);
      else select(t);

window.addEventListener("pointerup", endPointer);
window.addEventListener("pointercancel", endPointer);
svg.addEventListener("pointerleave", () => { if (!drag && state.hover) { state.hover = null; tip.hidden = true; refresh(); } });
svg.addEventListener("wheel", e => {
  e.preventDefault();

}, { passive: false });
$("zin").addEventListener("click", () => zoomAt(view.k * 1.5, CX, CY));
$("zout").addEventListener("click", () => zoomAt(view.k / 1.5, CX, CY));
$("zreset").addEventListener("click", () => zoomAt(1, CX, CY));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.activeElement !== $("q")) select(null);
});

// ---------- search ----------
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/['’ʿʾ`]/g, "")
  .replace(/\bal-/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const entries = [
  ...people.map(p => ({ t: "p", id: p.id, label: p.name, k: `${p.count} ${p.count === 1 ? "story" : "stories"}`, key: norm([p.name, p.short, ...p.aka].join(" ")), w: p.count })),
  ...stories.map(s => ({ t: "s", n: s.n, label: storyLabel(s), k: "story", key: norm(s.n + " " + s.title + " " + s.short), w: 0 })),
];
const q = $("q"), sugg = $("sugg");
let hits = [], act = 0;
function drawSugg() {
  sugg.innerHTML = "";
  hits.forEach((x, i) => {
    const li = h("li"), b = h("button", i === act ? "act" : ""); b.type = "button";
    b.setAttribute("role", "option"); b.setAttribute("aria-selected", i === act);
    b.append(h("span", null, x.label), h("span", "k", x.k));
    b.addEventListener("mousedown", ev => ev.preventDefault());
    b.addEventListener("click", () => pick(x));
    li.appendChild(b); sugg.appendChild(li);
  });
  sugg.hidden = !hits.length;
}
function pick(x) { q.value = ""; hits = []; drawSugg(); x.t === "p" ? selectPerson(x.id) : selectStory(x.n); }
q.addEventListener("input", () => {
  const v = norm(q.value);
  if (!v) { hits = []; drawSugg(); return; }
  const words = v.split(" ");
  hits = entries.filter(x => words.every(w => x.key.split(" ").some(kw => kw.startsWith(w)) || (/^\d+$/.test(w) && x.t === "s" && String(x.n) === w)))
    .sort((a, b) => (b.key.startsWith(v) - a.key.startsWith(v)) || (b.w - a.w) || a.label.localeCompare(b.label))
    .slice(0, 10);
  act = 0; drawSugg();
});
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" && hits.length) { act = (act + 1) % hits.length; drawSugg(); e.preventDefault(); }
  else if (e.key === "ArrowUp" && hits.length) { act = (act - 1 + hits.length) % hits.length; drawSugg(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[act]) { pick(hits[act]); e.preventDefault(); }
  else if (e.key === "Escape") { q.value = ""; hits = []; drawSugg(); }
});
q.addEventListener("blur", () => setTimeout(() => { hits = []; drawSugg(); }, 120));

// ---------- static furniture ----------
(function furniture() {
  const st = $("stats");
  const groupsN = D.groups.length;
  [["50", "stories"], [String(people.length), "people"], [String(links.length), "links"]].forEach(([b, t]) => {
    const s = h("span", "stat"); s.append(h("b", null, b), document.createTextNode(" " + t)); st.appendChild(s);
  });
  st.appendChild(h("span", "stat warn", "Unverified"));

  const lg = $("legend");
  parts.forEach((pt, i) => {
    const li = h("li"), sw = h("span", "sw"); sw.style.background = PART_COL[i];
    const a = pt.stories[0], b = pt.stories[pt.stories.length - 1];
    li.append(sw, document.createTextNode(`${pt.short} ${a}–${b}`)); lg.appendChild(li);
  });
  const li = h("li"); li.append(h("span", "dash"), document.createTextNode("not yet Muslim at the time")); lg.appendChild(li);

  const merged = D.merges.length;
  const notes = $("notes");
  notes.innerHTML =
    `<div><h4>Unverified</h4><p>${D.source.note} Nothing on this page has been reviewed by a scholar.</p></div>` +
    `<div><h4>Where it comes from</h4><p>Every story, name and role here is read from <b>${D.source.title}</b>, the project maintainer's Claude Doc (revision ${D.source.rev}, ${new Date(D.source.exported + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}). Nothing was added by hand.</p></div>` +
    `<div><h4>Same person, one point</h4><p>${merged} name forms were treated as the same person as a fuller form, for example <b>Abu Bakr</b> as <b>Abu Bakr al-Siddiq</b>, and ${D.splits.length === 1 ? "one entry naming two people was split in two" : D.splits.length + " entries naming two people were split"}. ${groupsN} groups, such as <b>Ahl al-Suffah</b>, are listed with their story but not drawn as points.</p></div>`;
})();

if (matchMedia("(pointer: coarse)").matches) $("hint").textContent = "Tap a person or a story. Pinch to zoom.";

// ---------- go ----------
function boot() {
  measure(); place();
  const tok = (location.hash || "").slice(1);
  if (/^s\d+$/.test(tok) && byN.has(+tok.slice(1))) select({ t: "s", n: +tok.slice(1) });
  else if (byId.has(tok)) select({ t: "p", id: tok });

}
boot();
new ResizeObserver(() => { measure(); clampView(); place(); }).observe(stage);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); place(); });
})();
