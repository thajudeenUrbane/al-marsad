<title>50 Stories, Connected</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the 50 stories sit on a dial read clockwise from the top; everyone they name is placed inside it,
   pulled toward the stories they appear in. A reading panel sits beside the dial, and below it on a phone.
   One deliberately dark look, shared with the project's other pages. */
:root{
  --bg:#0A0E11; --stage:#0C1216; --panel:#0F161C; --raise:#16212A;
  --edge:#1E2A33; --edge-soft:#151E25;
  --ink-hi:#EEF2EF; --ink:#C9D4D3; --ink-mid:#8D9C9E; --ink-dim:#66777E;
  --node:#8FA1A3;
  --p1:#B68F1B; --p2:#209993; --p3:#C35141; --p4:#8071C8;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--ink-hi);outline-offset:2px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.7rem 2rem;padding:.85rem 1.25rem .8rem;border-bottom:1px solid var(--edge)}
.top>div{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin:0}
.top h1{font-family:var(--f-display);font-weight:400;font-size:1.7rem;line-height:1.1;margin:.2rem 0 0;letter-spacing:-.01em;color:var(--ink-hi);text-wrap:balance}
.top .dek{margin:.4rem 0 0;color:var(--ink-mid);max-width:46rem;font-size:.9rem}
.stats{display:flex;flex-wrap:wrap;gap:.4rem;margin-left:auto}
.stat{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:.25rem .55rem;border:1px solid var(--edge);color:var(--ink-mid);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink-hi);font-weight:500}
.stat.warn{border-style:dashed;color:var(--ink)}

/* ---------- main ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 25rem;grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"stage tools" "stage panel";height:clamp(560px,calc(100dvh - 7rem),1150px);border-bottom:1px solid var(--edge)}
.tools{grid-area:tools;display:flex;flex-direction:column;gap:.7rem;padding:.9rem 1.25rem .85rem;background:var(--panel);border-left:1px solid var(--edge);border-bottom:1px solid var(--edge);min-width:0}
.search{position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--edge);padding:.45rem .65rem;font-size:.85rem;border-radius:2px}
.search input::placeholder{color:var(--ink-dim)}
.sugg{position:absolute;top:100%;left:0;right:0;z-index:6;background:var(--panel);border:1px solid var(--edge);list-style:none;margin:2px 0 0;padding:0;max-height:19rem;overflow-y:auto}
.sugg button{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;width:100%;padding:.45rem .65rem;font-size:.84rem;color:var(--ink)}
.sugg button.act,.sugg button:hover{background:var(--raise);color:var(--ink-hi)}
.sugg .k{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-dim);white-space:nowrap}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.25rem 1rem;font-size:.76rem;color:var(--ink-mid);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:.4rem;min-width:0;line-height:1.35}
.sw{width:9px;height:9px;border-radius:50%;flex:none}
.dash{width:18px;height:0;border-top:1.5px dashed var(--ink-mid);flex:none}

.stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 50%,#111A20 0%,var(--stage) 52%,var(--bg) 100%)}
#dial{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#dial.zoomed{touch-action:none;cursor:grab}
#dial.dragging{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--edge);background:rgba(15,22,28,.92);font-family:var(--f-mono);font-size:.95rem;color:var(--ink-mid)}
.zoom button:hover{color:var(--ink-hi);border-color:var(--ink-dim)}
.hint{position:absolute;left:12px;bottom:10px;margin:0;font-size:.72rem;color:var(--ink-dim);pointer-events:none;max-width:calc(100% - 70px)}
.tip{position:absolute;z-index:4;pointer-events:none;background:rgba(15,22,28,.97);border:1px solid var(--edge);padding:.4rem .6rem;font-size:.76rem;color:var(--ink-mid);max-width:17rem;transform:translate(-50%,calc(-100% - 12px));white-space:normal}
.tip b{display:block;font-family:var(--f-display);font-weight:500;font-size:.98rem;color:var(--ink-hi);line-height:1.25}

/* ---------- svg ---------- */
.edge{fill:none;stroke-width:.8;opacity:.22}
.edge.later{stroke-dasharray:3 2.5}
.node{cursor:pointer}
.node .dot{fill:var(--node);stroke:var(--stage);stroke-width:1.5}
.hit{fill:transparent;stroke:none}
.selring{fill:none;stroke:var(--ink-hi);stroke-width:1.2;pointer-events:none}
.lab{font-family:var(--f-body);font-size:11.5px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--stage);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none}
.lab.hi{fill:var(--ink-hi);font-size:12.5px;font-weight:600}
.story{cursor:pointer}
.story .dot{stroke:var(--stage);stroke-width:1.5}
.story text{font-family:var(--f-body);font-size:10.5px;fill:var(--ink-mid)}
.story .num{font-family:var(--f-mono);font-size:9.5px;fill:var(--ink-dim)}
.story:hover text,.story.hv text{fill:var(--ink-hi)}
.rimline{fill:none;stroke-width:1.5;opacity:.5}
.arcname{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ink-dim)}
#dial.narrow .arcname{display:none}

#dial.hovering:not(.focus) .edge{opacity:.07}
#dial.focus .edge{opacity:.045}
#dial.focus .edge.on{opacity:.95;stroke-width:1.5}
#dial .edge.hv{opacity:.9;stroke-width:1.4}
#dial.focus .node .dot{opacity:.26}
#dial.focus .node.co .dot{opacity:1}
#dial.focus .node.on .dot{opacity:1;fill:var(--ink-hi)}
#dial .node.hv .dot{opacity:1;fill:var(--ink-hi)}
#dial.focus .story{opacity:.32}
#dial.focus .story.on,#dial .story.hv{opacity:1}
#dial.focus .story.on text{fill:var(--ink-hi)}

/* ---------- panel ---------- */
.panel{grid-area:panel;border-left:1px solid var(--edge);background:var(--panel);overflow-y:auto;min-width:0;min-height:0}
.pin{padding:1.1rem 1.25rem 2.2rem;display:flex;flex-direction:column;gap:1.15rem}
.pin h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.15;margin:.15rem 0 0;color:var(--ink-hi);text-wrap:balance}
.pin h3{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:500;margin:0 0 .55rem}
.pin p{margin:0;color:var(--ink-mid);max-width:65ch}
.meta{font-size:.82rem;color:var(--ink-mid);margin-top:.35rem}
.meta b{color:var(--ink);font-weight:500}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.clear{flex:none;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);border:1px solid var(--edge);padding:.25rem .5rem}
.clear:hover{color:var(--ink-hi)}
.howto{display:flex;flex-direction:column;gap:.55rem;font-size:.86rem}
.howto p{color:var(--ink-mid)}
.howto b{color:var(--ink);font-weight:500}
.toplist,.lines,.plist,.alist{list-style:none;margin:0;padding:0}
.toplist button{display:grid;grid-template-columns:minmax(0,1fr) 6.5rem 1.4rem;align-items:center;gap:.7rem;width:100%;padding:.28rem 0;font-size:.85rem;color:var(--ink)}
.toplist button:hover{color:var(--ink-hi)}
.toplist .t{height:4px;background:var(--edge)}
.toplist .f{height:100%;background:var(--node)}
.toplist .c,.plist .num,.cochip .c{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.toplist .c{text-align:right}
.picks{display:flex;flex-wrap:wrap;gap:.35rem}
.chipbtn,.cochip{display:inline-flex;align-items:baseline;gap:.35rem;border:1px solid var(--edge);padding:.2rem .5rem;font-size:.78rem;color:var(--ink)}
.chipbtn:hover,.cochip:hover{border-color:var(--ink-dim);color:var(--ink-hi)}
.strip{display:flex;gap:1px}
.strip .cell{flex:1 1 0;height:14px;background:var(--edge-soft);min-width:0}
.strip .cell.pb{margin-left:4px}
.strip button.cell:hover{outline:1px solid var(--ink-hi);outline-offset:0}
.strip-k{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.62rem;color:var(--ink-dim);margin-top:.25rem}
.plist li{display:grid;grid-template-columns:1.9rem minmax(0,1fr);gap:.1rem .55rem;padding:.6rem 0;border-top:1px solid var(--edge-soft)}
.plist .num{padding-top:.1rem}
.plist .st{display:flex;align-items:center;gap:.45rem;color:var(--ink-hi);font-weight:500;font-size:.88rem}
.plist .st:hover{text-decoration:underline;text-underline-offset:3px}
.plist .role,.lines li{font-size:.84rem;color:var(--ink-mid);line-height:1.5}
.plist .role{grid-column:2}
.plist .with{grid-column:2;font-size:.78rem;color:var(--ink-dim)}
.tag{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-mid);border:1px dashed var(--ink-dim);padding:.02rem .3rem;white-space:nowrap}
.cochips{display:flex;flex-wrap:wrap;gap:.35rem}
.more{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-mid);text-decoration:underline;text-underline-offset:3px;margin-top:.5rem}
.storytext p{color:var(--ink);font-size:.92rem;line-height:1.62;margin:0 0 .75rem}
.storytext p:last-child{margin-bottom:0}
.note{font-size:.8rem;color:var(--ink-mid);border-left:2px solid var(--edge);padding-left:.65rem}
.lines{display:flex;flex-direction:column;gap:.6rem}
.pname{color:var(--ink-hi);font-weight:500;border-bottom:1px dotted var(--ink-dim)}
.pname:hover{border-bottom-color:var(--ink-hi)}
.grp{color:var(--ink);font-style:italic}
.pager{display:flex;justify-content:space-between;gap:.5rem}
.pager button{border:1px solid var(--edge);padding:.35rem .6rem;font-size:.78rem;color:var(--ink-mid);max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager button:hover{color:var(--ink-hi)}
details summary{cursor:pointer;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mid)}
.alist{columns:2;column-gap:1rem;margin-top:.6rem}
.alist li{break-inside:avoid}
.alist button{font-size:.8rem;color:var(--ink-mid);padding:.12rem 0;text-align:left}
.alist button:hover{color:var(--ink-hi)}

/* ---------- notes ---------- */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:1.1rem 2.2rem;padding:1.3rem 1.25rem 2.2rem;max-width:84rem;font-size:.8rem;color:var(--ink-mid)}
.notes h4{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:500;margin:0 0 .35rem}
.notes p{margin:0}
.notes b{color:var(--ink);font-weight:500}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"tools" "stage" "panel";height:auto}
  .tools{border-left:0}
  .stage{aspect-ratio:1/1.13;max-height:760px;width:100%}
  .zoom{flex-direction:row;bottom:8px;right:8px}
  .zoom button{width:30px;height:30px}
  .panel{border-left:0;border-top:1px solid var(--edge);overflow:visible}
  .top,.tools,.pin,.notes{padding-left:16px;padding-right:16px}
  .hint{bottom:14px;left:16px;max-width:calc(100% - 130px)}
}
@media (prefers-reduced-motion:no-preference){
  .edge,.node .dot,.story{transition:opacity .16s ease}
}
</style>

<header class="top">
  <div>
    <p class="eyebrow">al-Marṣad · a reading of one collection</p>
    <h1>50 Stories, Connected</h1>
    <p class="dek">Everyone named in the 50 stories of the Prophet ﷺ and his Companions, joined to each story they appear in. The stories run clockwise from the Cave of Hira at the top.</p>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main class="layout">
  <div class="tools">
      <div class="search">
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Find a person or a story" aria-label="Find a person or a story" aria-controls="sugg" aria-autocomplete="list">

      </div>
      <ul class="legend" id="legend"></ul>
  </div>
  <div class="stage" id="stage" role="region" aria-label="Story network">
      <svg id="dial" role="img" aria-label="A dial of the 50 stories with every named person placed inside it and joined to their stories. The same links are listed in the panel."></svg>
      <div class="tip" id="tip" hidden></div>
      <p class="hint" id="hint">Click a person or a story. Scroll to zoom, drag to move.</p>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">−</button>
        <button type="button" id="zreset" aria-label="Reset the view">○</button>
      </div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<section class="notes" id="notes"></section>

to lie.\" He said, \"Then I am a warner to you of a severe punishment.\" His uncle Abu Lahab cursed him, and Surah al-Masad was revealed in reply."],"lines":[{"head":[["p","abdullah-ibn-abbas"]],"role":"narrator of the hadith in al-Bukhari and Muslim.","later":false},{"head":[["p","ali-ibn-abi-talib"]],"role":"present at the related gathering of Banu Abd al-Muttalib, where he alone stood up in support of the Prophet ﷺ.","later":false},{"head":[["p","fatimah-bint-muhammad"],["t"," and "],["p","safiyyah-bint-abd-al-muttalib"]],"role":"addressed by name in the related warning: \"Save yourself from the Fire; I cannot avail you anything before Allah.\"","later":false}],"note":null},{"n":4,"title":"Bilal and \"Ahad, Ahad\"","short":"Bilal: Ahad","part":0,"paras":["Bilal was enslaved by Umayyah ibn Khalaf, who laid him on burning sand at midday with a heavy rock on his chest, demanding he reject Islam. Bilal only repeated, \"Ahad, Ahad\" (One, One). Abu Bakr bought him and set him free, and went on to free several other tortured believers."],"lines":[{"head":[["p","bilal-ibn-rabah"]],"role":"endured the torture; later the first mu'adhdhin of Islam.","later":false},{"head":[["p","abu-bakr-al-siddiq"]],"role":"bought and freed him.","later":false},{"head":[["p","amir-ibn-fuhayrah"]],"role":"another tortured slave freed by Abu Bakr.","later":false},{"head":[["p","zinnirah-al-rumiyyah"]],"role":"freed by Abu Bakr; she lost her sight under torture and Allah restored it.","later":false},{"head":[["g","Al-Nahdiyyah and her daughter"]],"role":"freed by Abu Bakr.","later":false},{"head":[["p","umm-ubays"],["t"," and "],["p","lubaynah"]],"role":"enslaved women freed by Abu Bakr.","later":false}],"note":null},{"n":5,"title":"The Family of Yasir","short":"Family of Yasir","part":0,"paras":["Yasir, his wife Sumayyah and their son Ammar were tortured by Banu Makhzum under Abu Jahl. Passing by, the Prophet ﷺ said, \"Patience, O family of Yasir, your promised meeting place is Paradise.\" Abu Jahl killed Sumayyah with a spear, making her the first martyr of Islam; Yasir also died under torture. When Ammar was forced to say words of disbelief, Allah revealed that one compelled while his heart is firm in faith is excused (16:106)."],"lines":[{"head":[["p","sumayyah-bint-khayyat"]],"role":"first martyr in Islam.","later":false},{"head":[["p","yasir-ibn-amir"]],"role":"martyred under torture.","later":false},{"head":[["p","ammar-ibn-yasir"]],"role":"survived; the verse of compulsion was revealed about him.","later":false}],"note":null},{"n":6,"title":"Abdullah ibn Mas'ud Recites at the Ka'bah","short":"Ibn Mas'ud recites","part":0,"paras":["The Companions wanted someone to recite the Qur'an aloud to Quraysh. Abdullah ibn Mas'ud, a small man with no powerful clan, volunteered. He stood at the Maqam and recited Surah al-Rahman until Quraysh beat him. He returned bruised and said he was ready to do it again the next day."],"lines":[{"head":[["p","abdullah-ibn-masud"]],"role":"first to recite the Qur'an publicly in Makkah after the Prophet ﷺ.","later":false},{"head":[],"role":"The early Companions gathered with him, who warned him he had no clan to protect him.","later":false}],"note":null},{"n":7,"title":"Hamzah Accepts Islam","short":"Hamzah's Islam","part":0,"paras":["Abu Jahl insulted and harmed the Prophet ﷺ near Safa. When Hamzah returned from hunting, a freedwoman told him what had happened. Furious, he went to Abu Jahl at the Ka'bah, struck him with his bow, and declared, \"Will you insult him when I follow his religion?\" He then embraced Islam fully, and Quraysh became more cautious."],"lines":[{"head":[["p","hamzah-ibn-abd-al-muttalib"]],"role":"the Prophet's uncle; \"Lion of Allah.\"","later":false}],"note":null},{"n":8,"title":"Umar ibn al-Khattab Accepts Islam","short":"Umar's Islam","part":0,"paras":["Umar set out with his sword to kill the Prophet ﷺ. Nu'aym ibn Abdullah told him his own sister had become Muslim. Umar burst into her house, where Khabbab was teaching her and her husband Surah Ta-Ha, and struck her. Seeing her blood and steadfastness, he asked to read the page. Moved, he went to Dar al-Arqam and accepted Islam. The Prophet ﷺ had prayed, \"O Allah, strengthen Islam with one of the two Umars.\" After this, Muslims prayed openly at the Ka'bah."],"lines":[{"head":[["p","umar-ibn-al-khattab"]],"role":"accepted Islam; later called al-Faruq.","later":false},{"head":[["p","fatimah-bint-al-khattab"]],"role":"his sister, whose firmness moved him.","later":false},{"head":[["p","said-ibn-zayd"]],"role":"her husband, one of the ten promised Paradise.","later":false},{"head":[["p","khabbab-ibn-al-aratt"]],"role":"was teaching them the Qur'an and hid in the house.","later":false},{"head":[["p","nuaym-ibn-abdullah-al-nahham"]],"role":"redirected Umar to his sister's house.","later":false},{"head":[["p","al-arqam-ibn-abi-al-arqam"]],"role":"owner of the house where the Muslims met.","later":false},{"head":[["p","hamzah-ibn-abd-al-muttalib"]],"role":"stood guard at the door when Umar arrived.","later":false}],"note":null},{"n":9,"title":"Ja'far Before the Negus of Abyssinia","short":"Abyssinia","part":0,"paras":["To escape persecution, a group of Muslims migrated to Abyssinia under a just Christian king. Quraysh sent Amr ibn al-As and Abdullah ibn Abi Rabi'ah with gifts to bring them back. Ja'far ibn Abi Talib spoke for the Muslims, describing the ignorance they had left and the truth they had found, then recited from Surah Maryam. The Negus wept and refused to hand them over."],"lines":[{"head":[["p","jafar-ibn-abi-talib"]],"role":"spokesman before the Negus.","later":false},{"head":[["p","umm-salamah"]],"role":"present; narrator of the account.","later":false},{"head":[["p","abu-salamah-ibn-abd-al-asad"]],"role":"her first husband, among the emigrants.","later":false},{"head":[["p","uthman-ibn-affan"],["t"," and "],["p","ruqayyah-bint-muhammad"]],"role":"among the first emigrants to Abyssinia.","later":false},{"head":[["p","asma-bint-umays"]],"role":"Ja'far's wife, among the emigrants.","later":false},{"head":[["p","al-zubayr-ibn-al-awwam"],["t",", "],["p","abdullah-ibn-masud"],["t",", "],["p","abd-al-rahman-ibn-awf"],["t",", "],["p","musab-ibn-umayr"],["t"," and "],["p","uthman-ibn-mazun"]],"role":"among the emigrants in the first or second migration.","later":false},{"head":[["p","al-najashi"]],"role":"the Negus; later accepted Islam, and the Prophet ﷺ prayed the funeral prayer in absentia for him.","later":false},{"head":[["p","amr-ibn-al-as"]],"role":"Quraysh's envoy <i>(accepted Islam later)<\/i>.","later":true},{"head":[["p","abdullah-ibn-abi-rabiah"]],"role":"the second envoy <i>(accepted Islam later)<\/i>.","later":true}],"note":null},{"n":10,"title":"The Boycott in Shi'b Abi Talib","short":"The boycott","part":0,"paras":["Quraysh hung a pact in the Ka'bah to boycott Banu Hashim and Banu al-Muttalib: no trade, no marriage. For about three years the Prophet ﷺ and his family were confined to a valley, surviving on leaves and scraps. Some sympathetic Qurayshis worked to end it, and the document was found eaten by termites except for the words \"In Your name, O Allah,\" just as the Prophet ﷺ had said."],"lines":[{"head":[["p","khadijah-bint-khuwaylid"]],"role":"endured the boycott and spent her wealth during it.","later":false},{"head":[["p","ali-ibn-abi-talib"]],"role":"inside the valley with the Prophet ﷺ.","later":false},{"head":[["p","sad-ibn-abi-waqqas"]],"role":"reported that hunger drove him to soften and eat a dried piece of leather.","later":false},{"head":[["p","al-abbas-ibn-abd-al-muttalib"]],"role":"of Banu Hashim, confined with them <i>(accepted Islam later, by most accounts)<\/i>.","later":true},{"head":[["p","hakim-ibn-hizam"]],"role":"Khadijah's nephew, who smuggled food to her <i>(accepted Islam later)<\/i>.","later":true},{"head":[["p","zuhayr-ibn-abi-umayyah"]],"role":"helped tear up the pact <i>(accepted Islam later, according to some reports)<\/i>.","later":true}],"note":null},{"n":11,"title":"The Journey to Ta'if","short":"Ta'if","part":0,"paras":["After the deaths of Abu Talib and Khadijah in the Year of Sorrow, the Prophet ﷺ walked to Ta'if to invite Thaqif. Its leaders rejected him and set youths to stone him until his feet bled. Resting in a garden, he made his famous supplication. The angel of the mountains offered to crush the town, but he said, \"I hope Allah will bring from their descendants people who worship Him alone.\" A Christian servant named Addas brought him grapes and believed."],"lines":[{"head":[["p","zayd-ibn-harithah"]],"role":"accompanied him and shielded him from the stones, suffering head wounds.","later":false},{"head":[["p","addas"]],"role":"the servant from Nineveh who believed in him.","later":false},{"head":[["p","aishah-bint-abi-bakr"]],"role":"narrator of the hadith of the angel of the mountains.","later":false}],"note":null},{"n":12,"title":"Al-Isra wal-Mi'raj","short":"Isra and Mi'raj","part":0,"paras":["In one night the Prophet ﷺ was taken from Makkah to Jerusalem, where he led the prophets in prayer, then ascended through the heavens, where the five daily prayers were prescribed. When he told Quraysh, they mocked him and ran to Abu Bakr. Abu Bakr said, \"If he said it, it is true,\" earning the title al-Siddiq."],"lines":[{"head":[["p","abu-bakr-al-siddiq"]],"role":"affirmed the journey immediately.","later":false},{"head":[["p","umm-hani-bint-abi-talib"]],"role":"the Prophet ﷺ spent that night at her house, by many reports, and told her first.","later":false},{"head":[["p","anas-ibn-malik"],["t"," and "],["p","malik-ibn-sasaah"]],"role":"main narrators of the Mi'raj hadith.","later":false}],"note":null},{"n":13,"title":"The Pledges of Aqabah","short":"Aqabah pledges","part":0,"paras":["In the pilgrimage seasons, groups from Yathrib met the Prophet ﷺ at Aqabah. Twelve pledged in the first year, and he sent Mus'ab ibn Umayr back with them as teacher. Through Mus'ab, the chiefs Sa'd ibn Mu'adh and Usayd ibn Hudayr accepted Islam. The next year seventy-three men and two women pledged to protect him as they would their own families, opening the way to the Hijrah."],"lines":[{"head":[["p","musab-ibn-umayr"]],"role":"first envoy and teacher of Islam in Madinah.","later":false},{"head":[["p","asad-ibn-zurarah"]],"role":"hosted Mus'ab and led the first group.","later":false},{"head":[["p","sad-ibn-muadh"]],"role":"chief of Aws; accepted Islam through Mus'ab, and his whole clan followed.","later":false},{"head":[["p","usayd-ibn-hudayr"]],"role":"Aws leader; accepted Islam through Mus'ab.","later":false},{"head":[["p","al-bara-ibn-marur"]],"role":"first to pledge at the second Aqabah.","later":false},{"head":[["p","ubadah-ibn-al-samit"]],"role":"present at both pledges; narrator of their terms.","later":false},{"head":[["p","kab-ibn-malik"]],"role":"present at the second pledge and narrated it.","later":false},{"head":[["p","abdullah-ibn-amr-ibn-haram"]],"role":"Jabir's father, accepted Islam that night.","later":false},{"head":[["p","jabir-ibn-abdullah"]],"role":"present at the second pledge as a young man.","later":false},{"head":[["p","sad-ibn-ubadah"]],"role":"leader of Khazraj at the pledge.","later":false},{"head":[["p","abu-al-haytham-ibn-al-tayyihan"]],"role":"among the twelve leaders (nuqaba).","later":false},{"head":[["p","nusaybah-bint-kab"],["t"," and "],["p","asma-bint-amr"]],"role":"the two women who pledged.","later":false},{"head":[["p","al-abbas-ibn-abd-al-muttalib"]],"role":"accompanied the Prophet ﷺ to secure the terms <i>(accepted Islam later, by most accounts)<\/i>.","later":true}],"note":null},{"n":14,"title":"The Hijrah and the Cave of Thawr","short":"Hijrah and Thawr","part":1,"paras":["Quraysh plotted to kill the Prophet ﷺ in his bed. Ali slept in his place under his green cloak, and the Prophet ﷺ left with Abu Bakr for the Cave of Thawr. When the trackers stood at its mouth, Abu Bakr whispered his fear, and the Prophet ﷺ said, \"What do you think of two when Allah is the third?\" (9:40). After three days they set out for Madinah. Suraqah ibn Malik chased them for the bounty, but his horse's legs sank into the sand three times; he asked for safety and was promised the bracelets of Kisra."],"lines":[{"head":[["p","abu-bakr-al-siddiq"]],"role":"companion in the cave and on the journey (\"the second of two\").","later":false},{"head":[["p","ali-ibn-abi-talib"]],"role":"slept in the Prophet's bed, then returned the people's trusts before following.","later":false},{"head":[["p","asma-bint-abi-bakr"]],"role":"carried food to the cave; tore her belt in two to tie the provisions, earning the name Dhat al-Nitaqayn.","later":false},{"head":[["p","aishah-bint-abi-bakr"]],"role":"narrated the account of the departure.","later":false},{"head":[["p","abdullah-ibn-abi-bakr"]],"role":"spent the nights in the cave and brought news of Quraysh.","later":false},{"head":[["p","amir-ibn-fuhayrah"]],"role":"grazed sheep over their tracks and supplied milk; travelled with them.","later":false},{"head":[["p","suraqah-ibn-malik"]],"role":"the pursuer, who later wore Kisra's bracelets in Umar's time <i>(accepted Islam later)<\/i>.","later":true},{"head":[["p","umm-mabad-al-khuzaiyyah"]],"role":"the woman whose dry goat gave milk when the Prophet ﷺ touched it; she gave the famous description of him <i>(accepted Islam later, by many reports)<\/i>.","later":true},{"head":[["p","buraydah-ibn-al-husayb"]],"role":"met them on the road with his tribe and accepted Islam.","later":false}],"note":"Abdullah ibn Urayqit, their hired guide, was not a Muslim at the time."},{"n":15,"title":"Arrival in Madinah and the Building of the Mosque","short":"Into Madinah","part":1,"paras":["The people of Madinah went out every morning to wait for the Prophet ﷺ. When he arrived, children sang, and every family wanted to host him. He let his camel walk freely, saying \"She is commanded.\" She knelt by a plot owned by two orphans, and he stayed at the nearby house of Abu Ayyub. The land was bought, and the Prophet ﷺ carried bricks alongside his Companions to build the mosque."],"lines":[{"head":[["p","abu-ayyub-al-ansari"]],"role":"hosted the Prophet ﷺ for months.","later":false},{"head":[["p","sahl-ibn-rafi"],["t"," and "],["p","suhayl-ibn-rafi"]],"role":"the two orphans who owned the land.","later":false},{"head":[["p","asad-ibn-zurarah"]],"role":"their guardian, who had prayed on the plot.","later":false},{"head":[["p","abu-bakr-al-siddiq"]],"role":"paid for the land, according to reports.","later":false},{"head":[["p","ammar-ibn-yasir"]],"role":"carried two bricks at a time; the Prophet ﷺ foretold, \"The transgressing party will kill him.\"","later":false},{"head":[["p","kulthum-ibn-al-hidm"]],"role":"hosted the Prophet ﷺ at Quba on arrival.","later":false},{"head":[["p","anas-ibn-malik"]],"role":"a boy who narrated the joyful arrival.","later":false},{"head":[["p","abdullah-ibn-salam"]],"role":"saw the Prophet's face and knew it was not the face of a liar (see story 19).","later":false}],"note":null},{"n":16,"title":"The Brotherhood of the Muhajirun and Ansar","short":"Brotherhood","part":1,"paras":["The Prophet ﷺ paired each emigrant from Makkah with a helper from Madinah as brothers. Sa'd ibn al-Rabi' offered Abd al-Rahman ibn Awf half his wealth. Abd al-Rahman thanked him and said, \"Just show me the way to the market.\" He traded and soon prospered."],"lines":[{"head":[["p","abd-al-rahman-ibn-awf"],["t"," and "],["p","sad-ibn-al-rabi"]],"role":"the famous pair.","later":false},{"head":[["p","salman-al-farisi"],["t"," and "],["p","abu-al-darda"]],"role":"brothers; Salman later advised him to balance worship with his family's rights.","later":false},{"head":[["p","abu-bakr-al-siddiq"],["t"," and "],["p","kharijah-ibn-zayd"]],"role":"paired as brothers.","later":false},{"head":[["p","umar-ibn-al-khattab"],["t"," and "],["p","itban-ibn-malik"]],"role":"paired as brothers.","later":false},{"head":[["p","abu-ubaydah-ibn-al-jarrah"],["t"," and "],["p","sad-ibn-muadh"]],"role":"paired as brothers.","later":false},{"head":[["p","ammar-ibn-yasir"],["t"," and "],["p","hudhayfah-ibn-al-yaman"]],"role":"paired as brothers, by some reports.","later":false},{"head":[["p","musab-ibn-umayr"],["t"," and "],["p","abu-ayyub-al-ansari"]],"role":"paired as brothers.","later":false},{"head":[["p","anas-ibn-malik"]],"role":"the brotherhood was declared in his family's house.","later":false}],"note":"The pairings listed follow Ibn Ishaq and Ibn Sa'd; some lists differ."},{"n":17,"title":"Salman al-Farisi's Search for Truth","short":"Salman's search","part":1,"paras":["Salman was born a Zoroastrian in Persia. Drawn to Christianity, he served a series of monks; the last told him a prophet would appear in a land of palms, who would accept gifts but not charity and carry the seal of prophethood between his shoulders. Sold into slavery in Madinah, he tested the Prophet ﷺ on all three signs and accepted Islam. The Prophet ﷺ helped him buy his freedom by planting 300 palm saplings with his own hands."],"lines":[{"head":[["p","salman-al-farisi"]],"role":"the seeker.","later":false},{"head":[["p","abdullah-ibn-abbas"]],"role":"narrated Salman's story as Salman told it.","later":false},{"head":[],"role":"The Companions who planted the palms with the Prophet ﷺ, and those who contributed gold for his ransom.","later":false}],"note":null},{"n":18,"title":"The First Adhan","short":"First adhan","part":1,"paras":["The Muslims discussed how to gather people for prayer: a bell, a horn or a fire. Abdullah ibn Zayd saw the words of the adhan in a dream. The Prophet ﷺ said, \"It is a true vision. Teach it to Bilal, for his voice is stronger.\" When Umar heard Bilal, he ran out saying he had seen the same dream."],"lines":[{"head":[["p","abdullah-ibn-zayd-ibn-abd-rabbih"]],"role":"saw the adhan in his dream.","later":false},{"head":[["p","bilal-ibn-rabah"]],"role":"the first to call it.","later":false},{"head":[["p","umar-ibn-al-khattab"]],"role":"had seen the same dream.","later":false},{"head":[["p","abdullah-ibn-umar"]],"role":"narrated the discussion about calling to prayer.","later":false},{"head":[["p","abdullah-ibn-umm-maktum"]],"role":"later also served as mu'adhdhin with Bilal.","later":false}],"note":null},{"n":19,"title":"Abdullah ibn Salam Accepts Islam","short":"Ibn Salam","part":1,"paras":["Abdullah ibn Salam, a leading Jewish scholar of Madinah, asked the Prophet ﷺ three questions only a prophet would know, and was satisfied. Before announcing his Islam, he hid while the Prophet ﷺ asked his community about him. They called him their best and son of their best. When he came out and declared his faith, they called him their worst."],"lines":[{"head":[["p","abdullah-ibn-salam"]],"role":"the scholar who believed; the Prophet ﷺ gave him glad tidings of Paradise.","later":false},{"head":[["p","anas-ibn-malik"]],"role":"narrated the account in Sahih al-Bukhari.","later":false},{"head":[["p","khalidah-bint-al-harith"]],"role":"his aunt, who accepted Islam with him, according to reports.","later":false}],"note":null},{"n":20,"title":"The Battle of Badr","short":"Badr","part":2,"paras":["In Ramadan of 2 AH, 313 Muslims with two horses faced about 1,000 Quraysh. Before battle, the Prophet ﷺ consulted his Companions, and both Muhajirun and Ansar pledged to follow him even into the sea. He spent the night in supplication until his cloak fell from his shoulders. Allah sent angels in support, and Quraysh were defeated, losing seventy dead including Abu Jahl."],"lines":[{"head":[["p","abu-bakr-al-siddiq"]],"role":"stayed with the Prophet ﷺ in his shelter and comforted him during his supplication.","later":false},{"head":[["p","umar-ibn-al-khattab"]],"role":"spoke in support before battle; narrated the Prophet's supplication.","later":false},{"head":[["p","al-miqdad-ibn-al-aswad"]],"role":"said, \"We will not say as the people of Musa said; we will fight on your right and your left.\"","later":false},{"head":[["p","sad-ibn-muadh"]],"role":"spoke for the Ansar; built the Prophet's shelter.","later":false},{"head":[["p","al-hubab-ibn-al-mundhir"]],"role":"advised camping at the last well.","later":false},{"head":[["p","hamzah-ibn-abd-al-muttalib"],["t",", "],["p","ali-ibn-abi-talib"],["t"," and "],["p","ubaydah-ibn-al-harith"]],"role":"fought the opening duels; Ubaydah was mortally wounded.","later":false},{"head":[["p","muadh-ibn-amr-ibn-al-jamuh"],["t"," and "],["p","muawwidh-ibn-afra"]],"role":"two young Ansar who struck down Abu Jahl.","later":false},{"head":[["p","abdullah-ibn-masud"]],"role":"found Abu Jahl dying and finished him.","later":false},{"head":[["p","bilal-ibn-rabah"]],"role":"confronted his former torturer Umayyah ibn Khalaf, who was killed.","later":false},{"head":[["p","umayr-ibn-al-humam"]],"role":"threw away his dates, saying the wait was too long, and fought until martyred.","later":false},{"head":[["p","harithah-ibn-suraqah"]],"role":"young martyr; the Prophet ﷺ told his mother he was in al-Firdaws.","later":false},{"head":[["p","sawad-ibn-ghaziyyah"]],"role":"see story 37.","later":false},{"head":[["p","talhah-ibn-ubaydillah"],["t"," and "],["p","said-ibn-zayd"]],"role":"sent to scout the caravan; counted among the people of Badr.","later":false},{"head":[["p","uthman-ibn-affan"]],"role":"stayed in Madinah by the Prophet's order to nurse Ruqayyah, who died; counted among the people of Badr.","later":false},{"head":[["p","abu-lubabah-ibn-abd-al-mundhir"]],"role":"left in charge of Madinah.","later":false},{"head":[["p","al-abbas-ibn-abd-al-muttalib"]],"role":"fought with Quraysh and was captured <i>(accepted Islam later)<\/i>.","later":true},{"head":[["p","abu-al-as-ibn-al-rabi"]],"role":"the Prophet's son-in-law, captured; Zaynab sent her mother's necklace as ransom <i>(accepted Islam later)<\/i>.","later":true}],"note":null},{"n":21,"title":"The Battle of Uhud","short":"Uhud","part":2,"paras":["In 3 AH, Quraysh returned with 3,000 men. The Prophet ﷺ placed fifty archers on a hill with orders never to leave. When the Muslims began winning, most archers left for the spoils. Khalid ibn al-Walid circled behind, and the Muslims were thrown into confusion. A rumour spread that the Prophet ﷺ had been killed. He was wounded in the face and his tooth broken, while a small band of Companions shielded him."],"lines":[{"head":[["p","hamzah-ibn-abd-al-muttalib"]],"role":"martyred by Wahshi's spear; called \"Master of the Martyrs.\"","later":false},{"head":[["p","musab-ibn-umayr"]],"role":"carried the flag until both hands were cut off, then martyred; his shroud was too short to cover him.","later":false},{"head":[["p","abdullah-ibn-jubayr"]],"role":"commander of the archers, who stayed at his post with a few and was martyred.","later":false},{"head":[["p","nusaybah-bint-kab"]],"role":"fought to defend the Prophet ﷺ and received many wounds.","later":false},{"head":[["p","talhah-ibn-ubaydillah"]],"role":"shielded the Prophet's face with his hand until it was paralysed.","later":false},{"head":[["p","sad-ibn-abi-waqqas"]],"role":"shot arrows as the Prophet ﷺ said, \"Shoot, may my father and mother be ransomed for you.\"","later":false},{"head":[["p","abu-dujanah"]],"role":"took the Prophet's sword \"with its right\" and used his back as a shield against arrows.","later":false},{"head":[["p","abu-ubaydah-ibn-al-jarrah"]],"role":"pulled the helmet rings from the Prophet's cheek with his teeth, losing two front teeth.","later":false},{"head":[["p","hanzalah-ibn-abi-amir"]],"role":"went out newly married without a ritual bath; washed by the angels after his martyrdom.","later":false},{"head":[["p","qatadah-ibn-al-numan"]],"role":"his eye came out; the Prophet ﷺ put it back, and it became his better eye.","later":false},{"head":[["p","abdullah-ibn-amr-ibn-haram"]],"role":"martyred; Allah spoke to him without a veil, as the Prophet ﷺ told his son Jabir.","later":false},{"head":[["p","amr-ibn-al-jamuh"]],"role":"though lame, insisted on fighting and was martyred.","later":false},{"head":[["p","anas-ibn-al-nadr"]],"role":"see story 22.","later":false},{"head":[["p","ali-ibn-abi-talib"],["t",", "],["p","abu-bakr-al-siddiq"],["t",", "],["p","umar-ibn-al-khattab"],["t"," and "],["p","al-zubayr-ibn-al-awwam"]],"role":"among those who stayed near the Prophet ﷺ.","later":false},{"head":[["p","fatimah-bint-muhammad"]],"role":"washed his wound and burnt a mat to stop the bleeding.","later":false},{"head":[["p","aishah-bint-abi-bakr"],["t"," and "],["p","umm-sulaym-bint-milhan"]],"role":"carried water to the wounded.","later":false},{"head":[["p","wahshi-ibn-harb"]],"role":"killed Hamzah <i>(accepted Islam later; see story 45)<\/i>.","later":true},{"head":[["p","khalid-ibn-al-walid"],["t"," and "],["p","ikrimah-ibn-abi-jahl"]],"role":"led the Quraysh cavalry <i>(both accepted Islam later)<\/i>.","later":true},{"head":[["p","abu-sufyan-ibn-harb"],["t"," and "],["p","hind-bint-utbah"]],"role":"led Quraysh <i>(both accepted Islam later)<\/i>.","later":true}],"note":null},{"n":22,"title":"Anas ibn al-Nadr: \"I Smell Paradise\"","short":"Anas ibn al-Nadr","part":2,"paras":["Anas ibn al-Nadr missed Badr and vowed that if Allah let him witness another battle, Allah would see what he would do. At Uhud, when others wavered, he said to Sa'd ibn Mu'adh, \"Paradise! By the Lord of the Ka'bah, I smell its scent beyond Uhud.\" He was found with more than eighty wounds, recognised only by his sister from his fingertips. The verse \"Among the believers are men who were true to their covenant with Allah\" (33:23) is linked to him."],"lines":[{"head":[["p","anas-ibn-al-nadr"]],"role":"the martyr.","later":false},{"head":[["p","sad-ibn-muadh"]],"role":"whom he addressed; Sa'd said, \"I could not do what he did.\"","later":false},{"head":[["p","al-rubayyi-bint-al-nadr"]],"role":"his sister, who identified him.","later":false},{"head":[["p","anas-ibn-malik"]],"role":"his nephew, narrator of the story.","later":false}],"note":null},{"n":23,"title":"The Battle of the Trench (al-Khandaq)","short":"The Trench","part":2,"paras":["In 5 AH, about 10,000 confederates marched on Madinah. On Salman's advice, the Muslims dug a trench across the open northern side in freezing cold and hunger. When a rock defeated them, the Prophet ﷺ struck it three times, and with each spark foretold the conquest of Syria, Persia and Yemen. After nearly a month, discord among the enemy and a fierce wind broke the siege."],"lines":[{"head":[["p","salman-al-farisi"]],"role":"proposed the trench; the Prophet ﷺ said, \"Salman is one of us, the People of the House.\"","later":false},{"head":[["p","jabir-ibn-abdullah"],["t"," and his wife "],["p","suhaylah-bint-masud"]],"role":"prepared a small goat and some barley that, by the Prophet's blessing, fed the whole army.","later":false},{"head":[["p","ali-ibn-abi-talib"]],"role":"answered the challenge of the champion Amr ibn Abd Wudd and killed him.","later":false},{"head":[["p","nuaym-ibn-masud"]],"role":"a new Muslim who sowed distrust between Quraysh and Banu Qurayzah.","later":false},{"head":[["p","hudhayfah-ibn-al-yaman"]],"role":"crossed into the enemy camp on the coldest night to bring news.","later":false},{"head":[["p","al-zubayr-ibn-al-awwam"]],"role":"volunteered to scout; the Prophet ﷺ called him \"my disciple (hawari).\"","later":false},{"head":[["p","sad-ibn-muadh"]],"role":"struck by an arrow in his arm (see story 24).","later":false},{"head":[["p","safiyyah-bint-abd-al-muttalib"]],"role":"defended the women's fort against an enemy who approached it.","later":false},{"head":[["p","hassan-ibn-thabit"]],"role":"was in the women's fort with Safiyyah.","later":false},{"head":[["p","al-bara-ibn-azib"]],"role":"narrated the Prophet ﷺ carrying earth until dust covered his chest.","later":false},{"head":[["p","abu-sufyan-ibn-harb"],["t",", "],["p","khalid-ibn-al-walid"],["t"," and "],["p","ikrimah-ibn-abi-jahl"]],"role":"among the confederates <i>(all accepted Islam later)<\/i>.","later":true}],"note":null},{"n":24,"title":"The Death of Sa'd ibn Mu'adh","short":"Death of Sa'd","part":2,"paras":["Wounded at the Trench, Sa'd prayed that he would not die until his heart was at peace regarding Banu Qurayzah, who had broken their treaty in the Muslims' most dangerous hour. Their case was referred to his judgment, which the Prophet ﷺ said matched the judgment of Allah. His wound then reopened and he died. The Prophet ﷺ said, \"The Throne of the Most Merciful shook at the death of Sa'd ibn Mu'adh,\" and seventy thousand angels attended his funeral."],"lines":[{"head":[["p","sad-ibn-muadh"]],"role":"chief of Aws.","later":false},{"head":[["p","rufaydah-al-aslamiyyah"]],"role":"nursed him in her tent in the mosque, the first field hospital in Islam.","later":false},{"head":[["p","abu-lubabah-ibn-abd-al-mundhir"]],"role":"tied himself to a pillar of the mosque in repentance after a mistake during the siege until Allah accepted his repentance.","later":false},{"head":[["p","jabir-ibn-abdullah"]],"role":"narrated the hadith of the Throne shaking.","later":false},{"head":[["p","aishah-bint-abi-bakr"]],"role":"described Sa'd's condition and the Prophet's grief.","later":false},{"head":[["p","umm-sad"]],"role":"his mother, whom the Prophet ﷺ consoled.","later":false}],"note":null},{"n":25,"title":"The Treaty of Hudaybiyah","short":"Hudaybiyah","part":2,"paras":["In 6 AH, the Prophet ﷺ set out with about 1,400 Companions for Umrah but was stopped at Hudaybiyah. He sent Uthman to negotiate, and when a rumour said Uthman was killed, the Companions pledged under a tree to stand firm. Quraysh then sent Suhayl ibn Amr, and a truce was signed with terms that seemed harsh to the Muslims. Allah called it \"a clear victory\" in Surah al-Fath, and within two years Islam spread more than ever before."],"lines":[{"head":[["p","uthman-ibn-affan"]],"role":"the envoy; the Prophet ﷺ pledged on his behalf with his own hand.","later":false},{"head":[["g","All who pledged under the tree (Bay'at al-Ridwan)"]],"role":"Allah declared He was pleased with them (48:18).","later":false},{"head":[["p","salamah-ibn-al-akwa"]],"role":"pledged three times at the Prophet's request.","later":false},{"head":[["p","ali-ibn-abi-talib"]],"role":"wrote the treaty; the Prophet ﷺ himself erased \"Messenger of Allah\" when Ali would not.","later":false},{"head":[["p","umar-ibn-al-khattab"]],"role":"questioned the terms in distress, later regretting it.","later":false},{"head":[["p","abu-bakr-al-siddiq"]],"role":"calmed Umar with the same answer the Prophet ﷺ had given.","later":false},{"head":[["p","umm-salamah"]],"role":"advised the Prophet ﷺ to shave his head first, after which all followed.","later":false},{"head":[["p","abu-jandal-ibn-suhayl"]],"role":"escaped to the Muslims in chains and was returned under the treaty.","later":false},{"head":[["p","al-mughirah-ibn-shubah"]],"role":"stood guard over the Prophet ﷺ with a sword.","later":false},{"head":[["p","abu-basir"]],"role":"later escaped and formed a group whose pressure led Quraysh to drop the return clause.","later":false},{"head":[["p","suhayl-ibn-amr"]],"role":"Quraysh's negotiator <i>(accepted Islam later)<\/i>.","later":true},{"head":[["p","urwah-ibn-masud-al-thaqafi"]],"role":"envoy who reported the Companions' love for the Prophet ﷺ <i>(accepted Islam later)<\/i>.","later":true},{"head":[["p","budayl-ibn-warqa-al-khuzai"]],"role":"carried messages between the sides <i>(accepted Islam later)<\/i>.","later":true}],"note":null},{"n":26,"title":"The Conquest of Khaybar","short":"Khaybar","part":2,"paras":["In 7 AH, the Muslims besieged the fortresses of Khaybar. After days of failed attempts, the Prophet ﷺ said, \"Tomorrow I will give the flag to a man who loves Allah and His Messenger and whom Allah and His Messenger love.\" Everyone hoped for it, but he called Ali, who had sore eyes. The Prophet ﷺ applied his saliva, the eyes were healed, and the fortress fell."],"lines":[{"head":[["p","ali-ibn-abi-talib"]],"role":"given the flag; led the conquest of the fort.","later":false},{"head":[["p","sahl-ibn-sad"]],"role":"narrated the hadith of the flag.","later":false},{"head":[["p","muhammad-ibn-maslamah"]],"role":"killed the champion Marhab according to some reports (others name Ali).","later":false},{"head":[["p","amir-ibn-al-akwa"]],"role":"recited poetry on the march; died when his own sword rebounded, and the Prophet ﷺ affirmed his double reward.","later":false},{"head":[["p","salamah-ibn-al-akwa"]],"role":"his nephew, who narrated it.","later":false},{"head":[["p","safiyyah-bint-huyayy"]],"role":"daughter of a Khaybar chief; married the Prophet ﷺ and became a Mother of the Believers.","later":false},{"head":[["p","jafar-ibn-abi-talib"]],"role":"returned from Abyssinia; the Prophet ﷺ said, \"I do not know which makes me happier, the conquest of Khaybar or the return of Ja'far.\"","later":false},{"head":[["p","abu-hurayrah"],["t"," and "],["p","abu-musa-al-ashari"]],"role":"arrived around this time and joined the Muslims.","later":false},{"head":[["p","bishr-ibn-al-bara-ibn-marur"]],"role":"died after eating from the poisoned sheep offered to the Prophet ﷺ.","later":false}],"note":null},{"n":27,"title":"The Battle of Mu'tah","short":"Mu'tah","part":2,"paras":["In 8 AH, 3,000 Muslims met a far larger Byzantine force. The Prophet ﷺ had named three commanders in turn: Zayd, then Ja'far, then Abdullah ibn Rawahah. All three were martyred. Khalid ibn al-Walid took the flag and withdrew the army skilfully. In Madinah, with tears in his eyes, the Prophet ﷺ announced each death before the news arrived, then said, \"A sword from the swords of Allah took the flag.\""],"lines":[{"head":[["p","zayd-ibn-harithah"]],"role":"first commander; martyred.","later":false},{"head":[["p","jafar-ibn-abi-talib"]],"role":"lost both hands holding the flag; given two wings in Paradise, hence \"al-Tayyar.\"","later":false},{"head":[["p","abdullah-ibn-rawahah"]],"role":"the poet; hesitated briefly, then advanced and was martyred.","later":false},{"head":[["p","thabit-ibn-aqram"]],"role":"picked up the fallen flag and handed it to Khalid.","later":false},{"head":[["p","khalid-ibn-al-walid"]],"role":"broke nine swords that day; named \"Sword of Allah.\"","later":false},{"head":[["p","abdullah-ibn-umar"]],"role":"counted over ninety wounds on Ja'far's front.","later":false},{"head":[["p","asma-bint-umays"]],"role":"Ja'far's wife, to whom the Prophet ﷺ brought the news.","later":false},{"head":[["p","abdullah-ibn-jafar"]],"role":"Ja'far's son, whom the Prophet ﷺ took in his care.","later":false}],"note":null},{"n":28,"title":"The Conquest of Makkah","short":"Makkah conquered","part":2,"paras":["When Quraysh's allies broke the Hudaybiyah truce, the Prophet ﷺ marched with 10,000 men in Ramadan of 8 AH. Makkah fell almost without fighting. He entered with his head bowed in humility, cleared 360 idols from around the Ka'bah reciting \"Truth has come and falsehood has vanished\" (17:81), and told his former persecutors, \"No blame on you today. Go, you are free.\""],"lines":[{"head":[["p","hatib-ibn-abi-baltaah"]],"role":"secretly wrote to Quraysh to protect his family; forgiven as a man of Badr.","later":false},{"head":[["p","ali-ibn-abi-talib"],["t",", "],["p","al-zubayr-ibn-al-awwam"],["t"," and "],["p","al-miqdad-ibn-al-aswad"]],"role":"sent to intercept Hatib's letter from a woman on the road.","later":false},{"head":[["p","umar-ibn-al-khattab"]],"role":"wanted to punish Hatib; told Allah may have forgiven the people of Badr.","later":false},{"head":[["p","al-abbas-ibn-abd-al-muttalib"]],"role":"brought Abu Sufyan to the Prophet ﷺ.","later":false},{"head":[["p","abu-sufyan-ibn-harb"]],"role":"accepted Islam; \"whoever enters Abu Sufyan's house is safe.\"","later":false},{"head":[["p","sad-ibn-ubadah"]],"role":"said \"Today is the day of slaughter\"; the flag was given to his son <b>Qays ibn Sa'd<\/b>.","later":false},{"head":[["p","khalid-ibn-al-walid"],["t",", "],["p","al-zubayr-ibn-al-awwam"],["t"," and "],["p","abu-ubaydah-ibn-al-jarrah"]],"role":"led columns into the city.","later":false},{"head":[["p","bilal-ibn-rabah"]],"role":"called the adhan from the roof of the Ka'bah.","later":false},{"head":[["p","uthman-ibn-talhah"]],"role":"the Prophet ﷺ returned the key of the Ka'bah to him, forever with his family.","later":false},{"head":[["p","abu-quhafah"]],"role":"Abu Bakr's elderly father; accepted Islam.","later":false},{"head":[["p","umm-hani-bint-abi-talib"]],"role":"gave protection to two relatives, and the Prophet ﷺ honoured it.","later":false},{"head":[["p","hind-bint-utbah"]],"role":"pledged allegiance among the women.","later":false},{"head":[["p","ikrimah-ibn-abi-jahl"],["t"," and "],["p","safwan-ibn-umayyah"]],"role":"fled, then returned and accepted Islam (see story 44).","later":false}],"note":null},{"n":29,"title":"The Battle of Hunayn","short":"Hunayn","part":2,"paras":["Weeks after the conquest, 12,000 Muslims met the Hawazin. Some were pleased by their numbers (9:25). Ambushed in a narrow valley, many fled, but the Prophet ﷺ rode forward saying, \"I am the Prophet, no lie; I am the son of Abd al-Muttalib.\" Al-Abbas called the Companions back, and they won. When the spoils went to new Muslims of Quraysh, some Ansar felt hurt, and the Prophet ﷺ told them, \"Are you not pleased that people go home with sheep and camels, and you go home with the Messenger of Allah?\" They wept until their beards were wet."],"lines":[{"head":[["p","al-abbas-ibn-abd-al-muttalib"]],"role":"called out, \"O people of the tree of Ridwan!\"","later":false},{"head":[["p","abu-sufyan-ibn-al-harith"]],"role":"the Prophet's cousin; held the reins of his mule.","later":false},{"head":[["p","abu-bakr-al-siddiq"],["t",", "],["p","umar-ibn-al-khattab"],["t",", "],["p","ali-ibn-abi-talib"],["t",", "],["p","al-fadl-ibn-abbas"],["t"," and "],["p","usamah-ibn-zayd"]],"role":"among the few who stood firm.","later":false},{"head":[["p","ayman-ibn-umm-ayman"]],"role":"stood firm and was martyred.","later":false},{"head":[["p","umm-sulaym-bint-milhan"]],"role":"carried a dagger to defend herself and the Prophet ﷺ.","later":false},{"head":[["p","al-bara-ibn-azib"]],"role":"narrated the Prophet's words during the retreat.","later":false},{"head":[["p","sad-ibn-ubadah"]],"role":"told the Prophet ﷺ of the Ansar's feelings and gathered them.","later":false},{"head":[["p","abu-said-al-khudri"]],"role":"narrated the speech to the Ansar.","later":false},{"head":[["p","al-shayma-bint-al-harith"]],"role":"his foster sister from Halimah, brought as a captive; he spread his cloak for her.","later":false},{"head":[["p","malik-ibn-awf-al-nasri"]],"role":"commander of Hawazin <i>(accepted Islam later)<\/i>.","later":true}],"note":null},{"n":30,"title":"The Expedition of Tabuk","short":"Tabuk","part":2,"paras":["In 9 AH, in severe heat and poverty, the Prophet ﷺ called for an expedition to Tabuk against Byzantium, known as the \"army of hardship.\" Companions gave all they could. Uthman equipped a large part of the army, and the Prophet ﷺ said, \"Nothing Uthman does after today will harm him.\" The army waited twenty days at Tabuk, no battle took place, and the tribes of the north made treaties."],"lines":[{"head":[["p","uthman-ibn-affan"]],"role":"gave hundreds of camels and 1,000 dinars.","later":false},{"head":[["p","abu-bakr-al-siddiq"]],"role":"gave all his wealth, leaving \"Allah and His Messenger\" for his family.","later":false},{"head":[["p","umar-ibn-al-khattab"]],"role":"gave half his wealth, hoping to surpass Abu Bakr.","later":false},{"head":[["p","abd-al-rahman-ibn-awf"]],"role":"gave a large sum.","later":false},{"head":[["p","abu-aqil-al-ansari"]],"role":"gave a small measure of dates earned by night labour; mocked by hypocrites, honoured by Allah (9:79).","later":false},{"head":[["g","Al-Bakka'un (the weepers)"]],"role":"poor Companions with no mounts who wept at being left behind (9:92).","later":false},{"head":[["p","ali-ibn-abi-talib"]],"role":"left in charge of the household: \"Are you not pleased to be to me as Harun was to Musa?\"","later":false},{"head":[["p","abu-khaythamah"]],"role":"stayed at first, then rode alone to catch up.","later":false},{"head":[["p","abu-dharr-al-ghifari"]],"role":"walked when his camel failed; \"he walks alone, will die alone, and be raised alone.\"","later":false},{"head":[["p","kab-ibn-malik"],["t",", "],["p","murarah-ibn-al-rabi"],["t"," and "],["p","hilal-ibn-umayyah"]],"role":"stayed behind (story 31).","later":false}],"note":null},{"n":31,"title":"Ka'b ibn Malik and the Three Who Stayed Behind","short":"Ka'b stays behind","part":2,"paras":["Ka'b had no excuse for missing Tabuk and refused to invent one. The Prophet ﷺ ordered the Muslims not to speak to him or his two companions for fifty days. The king of Ghassan wrote inviting him over; Ka'b threw the letter into an oven. On the fiftieth morning, Allah revealed their forgiveness (9:118), and a man ran up the mountain shouting the good news."],"lines":[{"head":[["p","kab-ibn-malik"]],"role":"told the truth; narrated the whole story.","later":false},{"head":[["p","murarah-ibn-al-rabi"],["t"," and "],["p","hilal-ibn-umayyah"]],"role":"the two other men of Badr who stayed behind.","later":false},{"head":[["p","abu-qatadah-al-ansari"]],"role":"Ka'b's cousin and closest friend, who would not reply to him.","later":false},{"head":[["p","talhah-ibn-ubaydillah"]],"role":"rose and shook Ka'b's hand in the mosque; Ka'b never forgot it.","later":false},{"head":[["g","Hilal's wife"]],"role":"allowed to keep serving her elderly husband.","later":false},{"head":[["p","abdullah-ibn-kab"]],"role":"Ka'b's son, who narrated the story from him.","later":false},{"head":[["p","abu-bakr-al-siddiq"]],"role":"announced the good news from the mountain, according to some reports.","later":false}],"note":null},{"n":32,"title":"Uthman and the Well of Rumah","short":"Well of Rumah","part":3,"paras":["When the Muslims reached Madinah, sweet water was scarce, and the well of Rumah belonged to a man who sold its water at a high price. The Prophet ﷺ said, \"Whoever buys the well of Rumah and makes it free for the Muslims will have a better one in Paradise.\" Uthman bought it, first half then all, and made it a free endowment for everyone."],"lines":[{"head":[["p","uthman-ibn-affan"]],"role":"bought the well; reminded the people of it during the siege of his house years later.","later":false},{"head":[["g","The Muslims of Madinah"]],"role":"who drank from it freely.","later":false}],"note":null},{"n":33,"title":"The Slander Against Aishah (al-Ifk)","short":"Al-Ifk","part":3,"paras":["Returning from an expedition, Aishah left the camp to search for a lost necklace, and the army departed without her. Safwan ibn al-Mu'attal found her and brought her back, leading the camel on foot. Hypocrites spread a lie about her, and for a month Madinah was troubled. Then Allah revealed ten verses of Surah al-Nur declaring her innocence."],"lines":[{"head":[["p","aishah-bint-abi-bakr"]],"role":"declared innocent by revelation; narrated the full account.","later":false},{"head":[["p","safwan-ibn-al-muattal"]],"role":"the Companion who found her; also cleared.","later":false},{"head":[["p","abu-bakr-al-siddiq"],["t"," and "],["p","umm-ruman"]],"role":"her parents, who suffered with her.","later":false},{"head":[["p","barirah"]],"role":"her servant, who testified she knew only good of her.","later":false},{"head":[["p","zaynab-bint-jahsh"]],"role":"co-wife who, when asked, protected Aishah's honour.","later":false},{"head":[["p","ali-ibn-abi-talib"],["t"," and "],["p","usamah-ibn-zayd"]],"role":"consulted by the Prophet ﷺ.","later":false},{"head":[["p","umm-mistah"]],"role":"told Aishah of the rumours.","later":false},{"head":[["p","mistah-ibn-uthathah"],["t",", "],["p","hassan-ibn-thabit"],["t"," and "],["p","hamnah-bint-jahsh"]],"role":"repeated the slander and repented; Abu Bakr resumed supporting Mistah after verse 24:22.","later":false},{"head":[["p","sad-ibn-muadh"],["t"," and "],["p","sad-ibn-ubadah"]],"role":"argued in the mosque over how to deal with the slanderers.","later":false}],"note":null},{"n":34,"title":"Zayd ibn Harithah Chooses the Prophet ﷺ","short":"Zayd chooses","part":3,"paras":["Zayd was kidnapped as a child and sold in Makkah; Khadijah gave him to the Prophet ﷺ before prophethood. Years later his father and uncle found him and came to buy his freedom. The Prophet ﷺ let Zayd choose freely. Zayd chose to stay, saying he would choose no one over him. The Prophet ﷺ then declared him his son before Quraysh."],"lines":[{"head":[["p","zayd-ibn-harithah"]],"role":"the only Companion named in the Qur'an (33:37).","later":false},{"head":[["p","khadijah-bint-khuwaylid"]],"role":"gave Zayd to the Prophet ﷺ.","later":false},{"head":[["p","usamah-ibn-zayd"]],"role":"his son, \"the beloved son of the beloved.\"","later":false},{"head":[["p","umm-ayman"]],"role":"Zayd's later wife and Usamah's mother.","later":false}],"note":null},{"n":35,"title":"Abu Hurayrah and the Cup of Milk","short":"Cup of milk","part":3,"paras":["Abu Hurayrah lived in the mosque with the poor of al-Suffah. One day, faint with hunger, he sat on the road hoping someone would invite him. The Prophet ﷺ saw his face, brought him home and sent him to call all the people of al-Suffah to share a single cup of milk. Abu Hurayrah served everyone first, then the Prophet ﷺ told him, \"Drink,\" again and again, until he said, \"I can drink no more.\" Abu Hurayrah also wept that his mother refused Islam. The Prophet ﷺ prayed for her, and he returned home to find her accepting Islam."],"lines":[{"head":[["p","abu-hurayrah"]],"role":"the narrator; later the most prolific narrator of hadith.","later":false},{"head":[["p","umaymah-bint-subayh"]],"role":"his mother, who accepted Islam through the Prophet's prayer.","later":false},{"head":[["g","Ahl al-Suffah"]],"role":"the poor Companions of the mosque who shared the cup.","later":false},{"head":[["p","abu-bakr-al-siddiq"],["t"," and "],["p","umar-ibn-al-khattab"]],"role":"passed by first; Abu Hurayrah asked them about a verse hoping for food.","later":false}],"note":null},{"n":36,"title":"Abu Talhah and Umm Sulaym: Generosity and Patience","short":"Abu Talhah's home","part":3,"paras":["A hungry guest came to the Prophet ﷺ, and Abu Talhah took him home with only enough food for their children. Umm Sulaym put the children to sleep and dimmed the lamp so the guest would not see they were not eating. In the morning, the Prophet ﷺ said Allah had admired their deed, and verse 59:9 was revealed. When their young son later died, Umm Sulaym prepared her husband's meal before gently telling him, and the Prophet ﷺ prayed for blessing on their night. They were given a son, Abdullah, whose children all memorised the Qur'an."],"lines":[{"head":[["p","abu-talhah-al-ansari"]],"role":"the host.","later":false},{"head":[["p","umm-sulaym-bint-milhan"]],"role":"his wife; famous for her wisdom and patience. Her mahr was Abu Talhah's Islam.","later":false},{"head":[["p","abu-umayr"]],"role":"their young son who died; the Prophet ﷺ used to tease him about his pet bird.","later":false},{"head":[["p","abdullah-ibn-abi-talhah"]],"role":"the son born after.","later":false},{"head":[["p","anas-ibn-malik"]],"role":"Umm Sulaym's son, the narrator.","later":false},{"head":[["p","abu-hurayrah"]],"role":"narrated the hadith of the guest.","later":false}],"note":null},{"n":37,"title":"Sawad ibn Ghaziyyah at Badr","short":"Sawad at Badr","part":3,"paras":["As the Prophet ﷺ straightened the ranks at Badr with an arrow, he poked Sawad in the stomach. Sawad said, \"You have hurt me; let me take retribution.\" The Prophet ﷺ uncovered his stomach. Sawad embraced him and kissed it, saying, \"I wanted my last contact in this world to be my skin touching yours.\" The Prophet ﷺ prayed for him."],"lines":[{"head":[["p","sawad-ibn-ghaziyyah"]],"role":"the Companion of the ranks.","later":false},{"head":[["g","The army of Badr"]],"role":"witnessed it as the ranks were straightened.","later":false}],"note":null},{"n":38,"title":"Julaybib","short":"Julaybib","part":3,"paras":["Julaybib was a poor man of humble appearance with no family. The Prophet ﷺ himself asked an Ansari family for their daughter's hand on his behalf. The parents hesitated, but the daughter said, \"Will you reject the Messenger's request? Send me to him.\" Soon after, Julaybib was martyred in battle having killed seven. The Prophet ﷺ searched for him, laid him on his own arms, and said, \"He is from me and I am from him.\""],"lines":[{"head":[["p","julaybib"]],"role":"the martyr.","later":false},{"head":[["g","His Ansari wife and her parents"]],"role":"she is unnamed in the Sahih narration; the Prophet ﷺ prayed for abundant blessing on her.","later":false},{"head":[["p","abu-barzah-al-aslami"]],"role":"narrated the account in Sahih Muslim.","later":false}],"note":null},{"n":39,"title":"Mu'adh ibn Jabal Sent to Yemen","short":"Mu'adh to Yemen","part":3,"paras":["When sending Mu'adh to Yemen, the Prophet ﷺ asked how he would judge. Mu'adh said by the Book of Allah, then the Sunnah, then by his own reasoning. The Prophet ﷺ praised Allah. Another time he took Mu'adh's hand and said, \"O Mu'adh, by Allah, I love you,\" and taught him to say after every prayer, \"O Allah, help me to remember You, thank You and worship You well.\" Walking beside Mu'adh's mount as he left, he told him he might not see him again. Mu'adh wept."],"lines":[{"head":[["p","muadh-ibn-jabal"]],"role":"the scholar of halal and haram.","later":false},{"head":[["p","abu-musa-al-ashari"]],"role":"sent to Yemen at the same time: \"Make things easy, not difficult.\"","later":false}],"note":null},{"n":40,"title":"Abdullah ibn Umm Maktum and Surah Abasa","short":"Ibn Umm Maktum","part":3,"paras":["The Prophet ﷺ was inviting Quraysh leaders when the blind Companion Ibn Umm Maktum came asking to be taught. The Prophet ﷺ frowned and turned away, hoping to win the leaders. Allah revealed \"He frowned and turned away\" (80:1). Afterwards the Prophet ﷺ honoured him, saying, \"Welcome to the one about whom my Lord reproached me,\" and made him deputy in Madinah many times."],"lines":[{"head":[["p","abdullah-ibn-umm-maktum"]],"role":"the blind Companion; mu'adhdhin and deputy governor of Madinah.","later":false},{"head":[["p","aishah-bint-abi-bakr"]],"role":"narrated the occasion of revelation.","later":false}],"note":null},{"n":41,"title":"Usamah's Intercession and Justice for All","short":"Usamah intercedes","part":3,"paras":["A woman of the noble Makhzum clan committed theft. Quraysh, worried for their status, asked Usamah, the Prophet's beloved, to intercede. The Prophet ﷺ said, \"Do you intercede regarding a limit set by Allah?\" He stood and declared that earlier nations were destroyed because they spared the noble and punished the weak, adding, \"If Fatimah the daughter of Muhammad stole, I would cut her hand.\""],"lines":[{"head":[["p","usamah-ibn-zayd"]],"role":"the intercessor, who asked forgiveness.","later":false},{"head":[["p","fatimah-bint-al-aswad-al-makhzumiyyah"]],"role":"the woman; she repented and later lived righteously.","later":false},{"head":[["p","aishah-bint-abi-bakr"]],"role":"narrated the hadith and said the woman's repentance was sincere.","later":false},{"head":[["p","fatimah-bint-muhammad"]],"role":"named as the example in his words.","later":false}],"note":null},{"n":42,"title":"Abu Dharr Accepts Islam","short":"Abu Dharr","part":3,"paras":["Hearing of a prophet in Makkah, Abu Dharr of Ghifar sent his brother, then went himself. He sat in the mosque for days, afraid to ask. Ali noticed the stranger and quietly led him to the Prophet ﷺ, where he accepted Islam. Abu Dharr then shouted the testimony of faith at the Ka'bah and was beaten until al-Abbas warned Quraysh that Ghifar lay on their trade route. He returned home, and half his tribe accepted Islam."],"lines":[{"head":[["p","abu-dharr-al-ghifari"]],"role":"the seeker.","later":false},{"head":[["p","unays"]],"role":"his brother, who brought the first report.","later":false},{"head":[["p","ali-ibn-abi-talib"]],"role":"hosted him and guided him to the Prophet ﷺ.","later":false},{"head":[["p","al-abbas-ibn-abd-al-muttalib"]],"role":"rescued him from the beating.","later":false},{"head":[["p","abdullah-ibn-abbas"]],"role":"narrated the story.","later":false},{"head":[["g","Tribes of Ghifar and Aslam"]],"role":"accepted Islam through him.","later":false}],"note":null},{"n":43,"title":"Al-Tufayl ibn Amr al-Dawsi","short":"Al-Tufayl","part":3,"paras":["Al-Tufayl, a poet and chief of Daws, was warned by Quraysh not to listen to the Prophet ﷺ, so he stuffed cotton in his ears. Then he thought, \"I am an intelligent man; I can tell good from bad.\" He listened, accepted Islam, and asked for a sign. A light shone on his whip as he returned. When his tribe was slow to respond, the Prophet ﷺ prayed, \"O Allah, guide Daws,\" and later eighty families came to Madinah."],"lines":[{"head":[["p","al-tufayl-ibn-amr-al-dawsi"]],"role":"the chief; later martyred at Yamamah.","later":false},{"head":[["p","abu-hurayrah"]],"role":"of Daws; accepted Islam through al-Tufayl.","later":false},{"head":[["g","Al-Tufayl's father and wife"]],"role":"accepted Islam when he returned.","later":false}],"note":null},{"n":44,"title":"Ikrimah ibn Abi Jahl's Return","short":"Ikrimah returns","part":3,"paras":["After the conquest of Makkah, Ikrimah, son of the Prophet's fiercest enemy, fled to Yemen. His wife Umm Hakim accepted Islam and secured a pardon for him. When he arrived, the Prophet ﷺ stood and greeted him warmly, and told his Companions not to insult Ikrimah's father in front of him, for insulting the dead hurts the living. Ikrimah became a devoted Muslim and was martyred at Yarmuk."],"lines":[{"head":[["p","ikrimah-ibn-abi-jahl"]],"role":"the one who returned.","later":false},{"head":[["p","umm-hakim-bint-al-harith"]],"role":"his wife, who brought him back.","later":false},{"head":[["p","safwan-ibn-umayyah"]],"role":"also fled and was pardoned through <b>Umayr ibn Wahb<\/b>.","later":false}],"note":null},{"n":45,"title":"Wahshi, the Killer of Hamzah","short":"Wahshi","part":3,"paras":["Wahshi, an Abyssinian slave, killed Hamzah at Uhud in return for his freedom. After the conquest of Makkah he feared for his life, then learned the Prophet ﷺ did not kill those who came to Islam. He came and accepted Islam. The Prophet ﷺ forgave him but asked, \"Can you keep your face away from me?\" Years later, Wahshi killed the false prophet Musaylimah at Yamamah with the same spear."],"lines":[{"head":[["p","wahshi-ibn-harb"]],"role":"accepted Islam and sought to atone.","later":false},{"head":[["p","hamzah-ibn-abd-al-muttalib"]],"role":"the beloved uncle he had killed.","later":false},{"head":[["p","jubayr-ibn-mutim"]],"role":"his master, who promised his freedom <i>(accepted Islam later)<\/i>.","later":true},{"head":[["p","hind-bint-utbah"]],"role":"urged him on at Uhud <i>(accepted Islam later)<\/i>.","later":true}],"note":null},{"n":46,"title":"Thumamah ibn Uthal","short":"Thumamah","part":3,"paras":["Thumamah, a chief of Yamamah, was captured by a Muslim cavalry unit and tied to a pillar of the mosque. For three days the Prophet ﷺ asked him how he was and treated him kindly, then freed him without ransom. Thumamah bathed, returned and accepted Islam, saying, \"No face on earth was more hateful to me than yours; now it is the most beloved.\" He then cut off grain from Yamamah to Makkah until Quraysh begged the Prophet ﷺ to intervene."],"lines":[{"head":[["p","thumamah-ibn-uthal"]],"role":"the chief.","later":false},{"head":[["p","muhammad-ibn-maslamah"]],"role":"led the cavalry unit that captured him, according to reports.","later":false},{"head":[["p","abu-hurayrah"]],"role":"narrated the story in al-Bukhari and Muslim.","later":false}],"note":null},{"n":47,"title":"The Delegation of Najran and the Mubahalah","short":"Mubahalah","part":3,"paras":["A Christian delegation from Najran came to discuss Isa (Jesus). When they would not accept the Qur'an's teaching, Allah commanded the Prophet ﷺ to invite them to a mutual invocation of Allah's curse on the liars (3:61). He came out with Ali, Fatimah, Hasan and Husayn. The delegation declined and made a peace treaty instead. They asked for a trustworthy man, and he sent Abu Ubaydah, \"the trustworthy one of this Ummah.\""],"lines":[{"head":[["p","ali-ibn-abi-talib"],["t",", "],["p","fatimah-bint-muhammad"],["t",", "],["p","al-hasan"],["t"," and "],["p","al-husayn"]],"role":"brought out for the Mubahalah.","later":false},{"head":[["p","abu-ubaydah-ibn-al-jarrah"]],"role":"sent with them as \"Amin al-Ummah.\"","later":false},{"head":[["p","sad-ibn-abi-waqqas"]],"role":"narrated the account in Sahih Muslim.","later":false},{"head":[["p","hudhayfah-ibn-al-yaman"]],"role":"narrated the hadith of the trustworthy man.","later":false}],"note":null},{"n":48,"title":"Ali and Fatimah: Marriage and the Gift of Tasbih","short":"Ali and Fatimah","part":3,"paras":["Ali married Fatimah with a simple mahr from the sale of his armour. Their home was humble. Fatimah's hands were blistered from the grinding stone, and Ali's chest ached from drawing water, so they asked the Prophet ﷺ for a servant from the captives. He came to them at night and said, \"Shall I tell you something better than a servant? When you go to bed, say SubhanAllah 33 times, Alhamdulillah 33 times and Allahu Akbar 34 times.\" Ali said he never left it afterwards."],"lines":[{"head":[["p","ali-ibn-abi-talib"]],"role":"narrated the hadith.","later":false},{"head":[["p","fatimah-bint-muhammad"]],"role":"\"leader of the women of Paradise.\"","later":false},{"head":[["p","aishah-bint-abi-bakr"]],"role":"Fatimah first came to her house and found the Prophet ﷺ absent.","later":false},{"head":[["p","uthman-ibn-affan"]],"role":"bought Ali's armour, according to some reports.","later":false},{"head":[["p","asma-bint-umays"],["t"," and "],["p","umm-ayman"]],"role":"helped prepare the wedding, according to reports.","later":false}],"note":null},{"n":49,"title":"The Farewell Pilgrimage","short":"Farewell Hajj","part":3,"paras":["In 10 AH, the Prophet ﷺ made his only Hajj with over 100,000 people. At Arafah he gave his great sermon: lives, wealth and honour are sacred; usury and blood feuds of ignorance are abolished; treat women well; hold to the Book of Allah. He asked, \"Have I conveyed?\" and they said, \"Yes,\" and he raised his finger to the sky: \"O Allah, bear witness.\" Then the verse was revealed: \"This day I have perfected your religion for you\" (5:3)."],"lines":[{"head":[["p","jabir-ibn-abdullah"]],"role":"narrated the longest, most detailed description of the Hajj.","later":false},{"head":[["p","rabiah-ibn-umayyah-ibn-khalaf"]],"role":"repeated the sermon loudly so the crowd could hear.","later":false},{"head":[["p","usamah-ibn-zayd"]],"role":"rode behind the Prophet ﷺ from Arafah to Muzdalifah.","later":false},{"head":[["p","al-fadl-ibn-abbas"]],"role":"rode behind him from Muzdalifah to Mina.","later":false},{"head":[["p","ali-ibn-abi-talib"]],"role":"came from Yemen and joined him with sacrificial animals.","later":false},{"head":[["p","aishah-bint-abi-bakr"]],"role":"her menstruation began; the Prophet ﷺ comforted her and she did Umrah after.","later":false},{"head":[["p","asma-bint-umays"]],"role":"gave birth to Muhammad ibn Abi Bakr at Dhul-Hulayfah.","later":false},{"head":[["p","umar-ibn-al-khattab"]],"role":"later confirmed the day and place verse 5:3 was revealed.","later":false},{"head":[["p","bilal-ibn-rabah"]],"role":"shaded the Prophet ﷺ with a cloth during the stoning, by some reports.","later":false},{"head":[["p","abu-bakr-al-siddiq"],["t",", "],["p","uthman-ibn-affan"],["t",", all of the Mothers of the Believers, and the great mass of Companions"]],"role":"performed Hajj with him.","later":false}],"note":null},{"n":50,"title":"The Final Illness and Passing of the Prophet ﷺ","short":"Final illness","part":3,"paras":["In Rabi' al-Awwal of 11 AH, the Prophet ﷺ fell ill and asked to be nursed in Aishah's house. When he could no longer lead the prayer, he said, \"Tell Abu Bakr to lead the people.\" On his last morning he lifted the curtain and smiled at the rows behind Abu Bakr. He died with his head on Aishah's chest, saying, \"With the highest companion.\" When Umar refused to believe it, Abu Bakr recited, \"Muhammad is but a messenger; messengers have passed away before him\" (3:144), and said, \"Whoever worshipped Muhammad, Muhammad has died; whoever worshipped Allah, Allah is alive and never dies.\""],"lines":[{"head":[["p","aishah-bint-abi-bakr"]],"role":"he died in her house, with his head on her chest.","later":false},{"head":[["p","abu-bakr-al-siddiq"]],"role":"led the prayers; gave the address that steadied the Ummah; became the first Caliph.","later":false},{"head":[["p","umar-ibn-al-khattab"]],"role":"overcome by grief, then accepted it when he heard the verse.","later":false},{"head":[["p","fatimah-bint-muhammad"]],"role":"he whispered she would be the first of his family to join him; she wept, then smiled.","later":false},{"head":[["p","abd-al-rahman-ibn-abi-bakr"]],"role":"brought the siwak the Prophet ﷺ used in his last moments.","later":false},{"head":[["p","ali-ibn-abi-talib"],["t",", "],["p","al-abbas-ibn-abd-al-muttalib"],["t",", "],["p","al-fadl-ibn-abbas"],["t"," and "],["p","qutham-ibn-abbas"],["t",", "],["p","usamah-ibn-zayd"],["t"," and "],["p","shuqran"]],"role":"washed his blessed body.","later":false},{"head":[["p","abu-talhah-al-ansari"]],"role":"dug his grave.","later":false},{"head":[["p","usamah-ibn-zayd"]],"role":"commander of the army he had ordered to Syria; Abu Bakr sent it after his death.","later":false},{"head":[["p","anas-ibn-malik"]],"role":"said, \"The day he came to Madinah everything shone; the day he died everything darkened.\"","later":false},{"head":[["p","bilal-ibn-rabah"]],"role":"could not finish the adhan for grief, and soon left Madinah.","later":false},{"head":[["p","umm-ayman"]],"role":"wept that revelation from heaven had ceased.","later":false},{"head":[["p","abdullah-ibn-abbas"]],"role":"narrated many details of the final days.","later":false}],"note":null}],"people":[{"id":"abd-al-rahman-ibn-abi-bakr","name":"Abd al-Rahman ibn Abi Bakr","short":"Abd al-Rahman ibn Abi Bakr","aka":[]},{"id":"abd-al-rahman-ibn-awf","name":"Abd al-Rahman ibn Awf","short":"Abd al-Rahman ibn Awf","aka":[]},{"id":"abdullah-ibn-abbas","name":"Abdullah ibn Abbas","short":"Ibn Abbas","aka":[]},{"id":"abdullah-ibn-abi-bakr","name":"Abdullah ibn Abi Bakr","short":"Abdullah ibn Abi Bakr","aka":[]},{"id":"abdullah-ibn-abi-rabiah","name":"Abdullah ibn Abi Rabi'ah","short":"Abdullah ibn Abi Rabi'ah","aka":[]},{"id":"abdullah-ibn-abi-talhah","name":"Abdullah ibn Abi Talhah","short":"Abdullah ibn Abi Talhah","aka":[]},{"id":"abdullah-ibn-amr-ibn-haram","name":"Abdullah ibn Amr ibn Haram","short":"Abdullah ibn Amr ibn Haram","aka":[]},{"id":"abdullah-ibn-jafar","name":"Abdullah ibn Ja'far","short":"Abdullah ibn Ja'far","aka":[]},{"id":"abdullah-ibn-jubayr","name":"Abdullah ibn Jubayr","short":"Abdullah ibn Jubayr","aka":[]},{"id":"abdullah-ibn-kab","name":"Abdullah ibn Ka'b","short":"Abdullah ibn Ka'b","aka":[]},{"id":"abdullah-ibn-masud","name":"Abdullah ibn Mas'ud","short":"Ibn Mas'ud","aka":[]},{"id":"abdullah-ibn-rawahah","name":"Abdullah ibn Rawahah","short":"Abdullah ibn Rawahah","aka":[]},{"id":"abdullah-ibn-salam","name":"Abdullah ibn Salam","short":"Abdullah ibn Salam","aka":[]},{"id":"abdullah-ibn-umar","name":"Abdullah ibn Umar","short":"Abdullah ibn Umar","aka":[]},{"id":"abdullah-ibn-umm-maktum","name":"Abdullah ibn Umm Maktum" function refresh() { applyClasses(); placeLabels(); placeRing(); }
function select(sel, opts = {}) {

    const tok = !sel ? "" : sel.t === "p" ? sel.id : "s" + sel.n;

const selectPerson = id => select({ t: "p", id });
const selectStory = n => select({ t: "s", n });

// ---------- panel ----------
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function personBtn(p, cls = "pname") { const b = h("button", cls, p.name); b.type = "button"; b.addEventListener("click", () => selectPerson(p.id)); return b; }
function storyLabel(s) { return s.n + " · " + s.title; }
function headRow(eyebrow, title) {

  const c = h("button", "clear", "Clear"); c.type = "button"; c.addEventListener("click", () => select(null));

}
function strip(p) {

function renderIntro() {
  const f = document.createDocumentFragment();
  const how = h("div", "howto");
  how.innerHTML =
    "<p class='eyebrow'>How to read it</p>" +
    "<p><b>Each point is a person</b> named in the stories. <b>Each line</b> joins a person to a story they appear in, coloured by the part of the collection that story belongs to.</p>" +
    "<p>Someone in only one story sits close to it on the rim. Someone who appears across many stories is pulled toward the middle.</p>" +
    "<p><b>A dashed line</b> means the person had not yet accepted Islam at the time of that story.</p>" +
    "<p><b>Circle size</b> counts how many of these 50 stories name the person. It is a count from this one collection, not a measure of rank or merit.</p>" +
    "<p>The Prophet ﷺ is in every story, so he is not drawn as a separate point.</p>";

  const top = h("div"); top.appendChild(h("h3", null, "Named in the most stories"));
  const ul = h("ul", "toplist");

    b.append(h("span", null, p.name), t, h("span", "c", p.count));

  const picks = h("div"); picks.appendChild(h("h3", null, "Or start with a story"));

  [2, 14, 16, 20, 25, 50].forEach(n => {

  const det = h("details"); det.appendChild(h("summary", null, `All ${people.length} people, A to Z`));
  const al = h("ul", "alist");
