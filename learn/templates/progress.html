<div class="learn-progress" data-progress data-total="$total" hidden>
<p class="progress-count" aria-live="polite" data-progress-count data-template="[[learn.progress.count]]"></p>
<p class="note">[[learn.progress.local_only]]</p>
<p><button type="button" data-progress-reset>[[learn.progress.reset]]</button></p>
</div>
<template id="learn-step-done"><p class="step-done"><label><input type="checkbox" data-step-check> [[learn.progress.mark_done]]</label></p></template>
