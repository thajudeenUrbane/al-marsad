<!doctype html>
<html lang="$lang" dir="$dir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<link rel="stylesheet" href="${base}assets/site.css">
</head>
<body class="$body_class">
<a class="skip-link" href="#main">[[nav.skip]]</a>
<header class="site-header">
<a class="home-link" href="${base}">[[site.name]]</a>
<nav class="site-nav" aria-label="[[nav.sections]]">
<ul>
$nav
</ul>
</nav>
$search_box
<button type="button" class="plain-toggle" aria-pressed="false" title="[[plain.help]]" hidden>[[plain.label]] <span class="plain-state plain-off" aria-hidden="true">[[plain.off]]</span><span class="plain-state plain-on" aria-hidden="true">[[plain.on]]</span></button>
</header>
<main id="main" tabindex="-1">
$breadcrumb
$body
</main>
$footer
<script src="${base}assets/enhance.js" defer></script>
$scripts
</body>
</html>
