<form class="site-search" role="search" action="${base}search/" method="get">
<label class="sr-only" for="site-q">[[search.label]]</label>
<input id="site-q" name="q" type="search" dir="auto" placeholder="[[search.placeholder]]" autocomplete="off" spellcheck="false" enterkeyhint="search">
<button type="submit">[[search.submit]]</button>
</form>
