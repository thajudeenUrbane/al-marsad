<article class="entity kind-$kind$extra_class">
<header class="entity-head">
<p class="kicker">$type_label</p>
<h1>$h1</h1>
$banner
<p class="coverage">$coverage</p>
</header>
$facts
$thread
$story
<section class="evidence" id="evidence" aria-labelledby="evidence-h">
<h2 id="evidence-h">[[evidence.heading]]</h2>
<p class="evidence-lead">$evidence_lead</p>
$sections
</section>
<section class="details-layer" aria-labelledby="details-heading">
<h2 id="details-heading">[[details.heading]]</h2>
<details class="details">
<summary>[[details.summary]]</summary>
$details
</details>
</section>
</article>
