<div class="thread-root" id="thread-root" data-fetch="${base}thread.json" data-self="$focus" data-base="$base" data-loading="[[thread.loading]]" data-failed="[[thread.failed]]" hidden>
<button type="button" class="thread-open">[[thread.open]]</button>
<p class="note">[[thread.open_note]]</p>
<p class="thread-status" role="status" aria-live="polite"></p>
</div>
